<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Мгновенный счёт</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; font-family: 'Montserrat', sans-serif; background: #F5EDE3; position: fixed; }

  .app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }

  .screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; width: 100%; animation: fadeIn 0.5s ease; }
  .screen.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

  /* ГЛАВНЫЙ ЭКРАН С ВИДЕО */
  #screen-menu { position: relative; overflow: hidden; }
  
  .fullscreen-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  .fullscreen-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  
  .video-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(245, 237, 227, 0.4) 0%, rgba(245, 237, 227, 0.2) 50%, rgba(139, 115, 85, 0.5) 100%);
    z-index: 1;
    pointer-events: none;
  }
  
  .menu-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 0 30px;
    padding-bottom: calc(80px + env(safe-area-inset-bottom));
  }

  .title-pill {
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 30px;
    padding: 12px 30px;
    margin-bottom: 40px;
    font-size: 20px;
    font-weight: 900;
    font-family: 'Montserrat', sans-serif;
    color: #6B5A45;
    box-shadow: 0 8px 25px rgba(139, 115, 85, 0.2), inset 0 2px 10px rgba(255,255,255,0.9);
  }

  .cashmere-btn {
    background: linear-gradient(135deg, rgba(212, 197, 176, 0.7) 0%, rgba(228, 213, 192, 0.7) 100%);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 60px;
    padding: 22px 70px;
    font-size: 24px;
    font-weight: 800;
    font-family: 'Montserrat', sans-serif;
    color: #6B5A45;
    box-shadow: 0 12px 35px rgba(139, 115, 85, 0.3), inset 0 3px 15px rgba(255,255,255,0.95);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cashmere-btn:active { transform: scale(0.9); }

  /* ИГРОВОЙ ЭКРАН */
  .game-header { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; }
  .pill { 
    background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border: 1.5px solid rgba(255,255,255,0.8); 
    border-radius: 30px; padding: 10px 20px; font-size: 16px; font-weight: 800; color: #6B5A45; 
    box-shadow: 0 4px 15px rgba(139, 115, 85, 0.1);
  }

  .instruction { font-size: 14px; font-weight: 700; color: #8B7355; text-align: center; margin-bottom: 15px; padding: 0 10px; }

  .dots-zone {
    flex: 1;
    width: 100%;
    min-height: 250px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 30px;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    box-shadow: 0 10px 30px rgba(139, 115, 85, 0.15), inset 0 3px 15px rgba(255,255,255,0.9);
    margin-bottom: 15px;
  }
  .dots-zone::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 100%); border-radius: 28px 28px 0 0; pointer-events: none; }

  .dot {
    position: absolute;
    width: 40px; height: 40px;
    border-radius: 50%;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2), inset 0 3px 8px rgba(255,255,255,0.5);
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .dot::before { content: ''; position: absolute; top: 15%; left: 15%; right: 15%; height: 30%; background: linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 100%); border-radius: 50%; pointer-events: none; }
  @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }

  .numbers-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    width: 100%;
    max-width: 280px;
    margin-bottom: calc(20px + env(safe-area-inset-bottom));
    transition: opacity 0.3s ease;
  }
  .number-btn {
    aspect-ratio: 1.5;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 25px;
    font-size: 36px; font-weight: 900; font-family: 'Montserrat', sans-serif; color: #6B5A45;
    box-shadow: 0 8px 20px rgba(139, 115, 85, 0.15), inset 0 3px 10px rgba(255,255,255,0.9);
    cursor: pointer; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex; align-items: center; justify-content: center;
  }
  .number-btn:active { transform: scale(0.9); }
  .number-btn.correct {
    background: linear-gradient(135deg, #B5EAD7 0%, #C8F0E1 100%);
    animation: correctPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .number-btn.wrong {
    animation: shake 0.4s ease;
    background: linear-gradient(135deg, rgba(255, 195, 208, 0.7) 0%, rgba(255, 210, 220, 0.7) 100%);
  }
  @keyframes correctPop { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .particle {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 100;
    animation: explode 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }
  @keyframes explode {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }

  .flash-overlay { position: absolute; inset: 0; z-index: 99; pointer-events: none; opacity: 0; transition: opacity 0.1s ease; }
  .flash-overlay.active { opacity: 0.5; }

  .result-box { 
    background: rgba(255,255,255,0.5); backdrop-filter: blur(25px); border: 2px solid rgba(255,255,255,0.9); 
    border-radius: 50px; padding: 50px 40px; text-align: center; 
    box-shadow: 0 25px 60px rgba(139, 115, 85, 0.2); width: 100%; max-width: 340px;
  }
  .result-title { font-size: 32px; font-weight: 900; color: #8B7355; margin-bottom: 25px; }
  .result-stats { display: flex; justify-content: space-around; margin-bottom: 35px; }
  .stat-val { font-size: 32px; font-weight: 900; color: #D4A5A5; }
  .stat-lbl { font-size: 11px; font-weight: 800; color: #A89880; text-transform: uppercase; }

</style>
</head>
<body>

<div class="app">
  <!-- ГЛАВНЫЙ ЭКРАН С ВИДЕО -->
  <div class="screen active" id="screen-menu">
    <div class="fullscreen-video">
      <video src="intro.mp4" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>
    <div class="menu-content">
      <div class="title-pill">Мгновенный счёт</div>
      <button class="cashmere-btn" onclick="startGame()">Старт</button>
    </div>
  </div>

  <!-- ИГРОВОЙ ЭКРАН -->
  <div class="screen" id="screen-game">
    <div class="game-header">
      <div class="pill" id="score">0</div>
      <div class="pill" id="combo">x1</div>
      <div class="pill" id="level">Уровень 1</div>
    </div>
    <div class="instruction" id="instruction">Запомни количество точек!</div>
    <div class="dots-zone" id="dotsZone"></div>
    <div class="numbers-grid" id="numbersGrid"></div>
  </div>

  <!-- ЭКРАН РЕЗУЛЬТАТА -->
  <div class="screen" id="screen-result">
    <div class="result-box">
      <div class="result-title" id="resultTitle">Отлично!</div>
      <div class="result-stats">
        <div><div class="stat-val" id="res-score">0</div><div class="stat-lbl">Очки</div></div>
        <div><div class="stat-val" id="res-accuracy">0%</div><div class="stat-lbl">Точность</div></div>
        <div><div class="stat-val" id="res-level">1</div><div class="stat-lbl">Уровень</div></div>
      </div>
      <button class="cashmere-btn" onclick="startGame()" style="padding: 18px 50px; font-size: 20px;">Ещё раз</button>
    </div>
  </div>
</div>

<script>
  const dotColors = ['#FF6B8A', '#4ECDC4', '#A78BFA', '#FBBF24', '#34D399', '#F472B6', '#60A5FA', '#FB923C'];
  
  let gameState = {
    active: false,
    score: 0,
    combo: 1,
    maxCombo: 1,
    hits: 0,
    misses: 0,
    level: 1,
    correctNumber: 0,
    showTime: 1000,
    rounds: 0,
    maxRounds: 15
  };

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function getRandomColor() {
    return dotColors[Math.floor(Math.random() * dotColors.length)];
  }

  function startGame() {
    gameState = {
      active: true,
      score: 0,
      combo: 1,
      maxCombo: 1,
      hits: 0,
      misses: 0,
      level: 1,
      correctNumber: 0,
      showTime: 1000,
      rounds: 0,
      maxRounds: 15
    };

    updateUI();
    showScreen('screen-game');
    setTimeout(() => nextRound(), 500);
  }

  function nextRound() {
    if (!gameState.active) return;
    gameState.rounds++;

    if (gameState.rounds > gameState.maxRounds) {
      endGame();
      return;
    }

    let minDots, maxDots;
    if (gameState.level <= 3) {
      minDots = 2;
      maxDots = 5;
    } else {
      minDots = 5;
      maxDots = 10;
    }
    
    gameState.correctNumber = Math.floor(Math.random() * (maxDots - minDots + 1)) + minDots;
    gameState.showTime = Math.max(500, 1200 - gameState.level * 100);

    showDots();

    document.getElementById('numbersGrid').style.opacity = '0';
    document.getElementById('numbersGrid').style.pointerEvents = 'none';
    document.getElementById('instruction').textContent = 'Запомни количество!';

    setTimeout(() => {
      hideDots();
      setTimeout(() => {
        showNumbers();
        document.getElementById('instruction').textContent = 'Сколько было точек?';
      }, 300);
    }, gameState.showTime);
  }

  function showDots() {
    const zone = document.getElementById('dotsZone');
    zone.innerHTML = '';
    const zoneWidth = zone.offsetWidth || 400;
    const zoneHeight = zone.offsetHeight || 250;
    const color = getRandomColor();

    for (let i = 0; i < gameState.correctNumber; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.background = color;
      
      const x = Math.random() * (zoneWidth - 80) + 20;
      const y = Math.random() * (zoneHeight - 80) + 20;
      dot.style.left = x + 'px';
      dot.style.top = y + 'px';
      
      zone.appendChild(dot);
    }
  }

  function hideDots() {
    const dots = document.querySelectorAll('.dot');
    dots.forEach(dot => {
      dot.style.animation = 'popOut 0.3s ease forwards';
    });
    setTimeout(() => {
      document.getElementById('dotsZone').innerHTML = '';
    }, 300);
  }

  function showNumbers() {
    const grid = document.getElementById('numbersGrid');
    grid.innerHTML = '';
    grid.style.opacity = '1';
    grid.style.pointerEvents = 'auto';

    const options = new Set([gameState.correctNumber]);
    
    let wrongAnswer;
    do {
      const offset = Math.random() < 0.5 ? -1 : 1;
      wrongAnswer = gameState.correctNumber + offset;
      if (wrongAnswer < 1) wrongAnswer = gameState.correctNumber + 2;
    } while (options.has(wrongAnswer));
    
    options.add(wrongAnswer);

    const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

    shuffled.forEach(num => {
      const btn = document.createElement('div');
      btn.className = 'number-btn';
      btn.textContent = num;
      btn.onclick = () => handleAnswer(num, btn);
      grid.appendChild(btn);
    });
  }

  function handleAnswer(num, btn) {
    if (!gameState.active) return;

    if (num === gameState.correctNumber) {
      btn.classList.add('correct');
      gameState.hits++;
      gameState.score += 10 * gameState.combo;
      gameState.combo++;
      if (gameState.combo > gameState.maxCombo) gameState.maxCombo = gameState.combo;

      if (navigator.vibrate) navigator.vibrate(50);

      const rect = btn.getBoundingClientRect();
      createExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2, '#B5EAD7');
      triggerFlash('#B5EAD7');

      playSuccessSound();

      if (gameState.hits % 5 === 0) {
        gameState.level++;
      }

      updateUI();

      setTimeout(() => nextRound(), 800);
    } else {
      btn.classList.add('wrong');
      gameState.misses++;
      gameState.combo = 1;

      if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
      playErrorSound();

      updateUI();

      setTimeout(() => btn.classList.remove('wrong'), 400);
    }
  }

  function createExplosion(x, y, color) {
    for (let i = 0; i < 25; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 15 + 8;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.background = color;
      particle.style.left = x + 'px';
      particle.style.top = y + 'px';

      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 150 + 50;
      particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
      particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');

      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 800);
    }
  }

  function triggerFlash(color) {
    const flash = document.getElementById('flash');
    flash.style.background = color;
    flash.classList.add('active');
    setTimeout(() => flash.classList.remove('active'), 150);
  }

  function updateUI() {
    document.getElementById('score').textContent = gameState.score;
    document.getElementById('combo').textContent = 'x' + gameState.combo;
    document.getElementById('level').textContent = 'Уровень ' + gameState.level;
  }

  function playSuccessSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 800;
      gain.gain.value = 0.1;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
  }

  function playErrorSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 200;
      gain.gain.value = 0.1;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
  }

  function endGame() {
    gameState.active = false;
    const accuracy = gameState.hits + gameState.misses > 0 
      ? Math.round(gameState.hits / (gameState.hits + gameState.misses) * 100) 
      : 0;

    document.getElementById('res-score').textContent = gameState.score;
    document.getElementById('res-accuracy').textContent = accuracy + '%';
    document.getElementById('res-level').textContent = gameState.level;

    const title = accuracy >= 80 ? 'Гений!' : accuracy >= 60 ? 'Отлично!' : 'Хорошо!';
    document.getElementById('resultTitle').textContent = title;

    showScreen('screen-result');
  }
</script>
</body>
</html>
